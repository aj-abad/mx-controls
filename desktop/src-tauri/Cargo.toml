[package]
name = "mx-controls"
version = "0.1.0"
edition = "2021"

[lib]
name = "mx_controls_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# One portable exe with the agent inside it, for `deploy.cmd`. The installer ships the agent beside the app instead.
embedded-agent = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "sync", "time", "macros"] }
